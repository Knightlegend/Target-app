<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster | Production Task Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#3b82f6',
            surface: '#0f172a',
            surfaceCard: '#1e293b'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Navigation Bar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30 px-6 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
          <i class="fa-solid fa-check-double text-lg"></i>
        </div>
        <div>
          <span class="font-bold text-lg text-white tracking-wide">TaskMaster</span>
          <span class="text-[10px] ml-2 px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 font-mono">v1.0.0</span>
        </div>
      </div>

      <!-- Health Indicator -->
      <div class="flex items-center gap-3">
        <div id="healthBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-xs">
          <span class="w-2 h-2 rounded-full bg-slate-500"></span>
          <span class="text-slate-400">Probing backend...</span>
        </div>
        <a href="http://localhost:8000" target="_blank" class="text-xs text-slate-400 hover:text-white flex items-center gap-1.5">
          <span>Agent Autopsy</span>
          <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-6xl mx-auto w-full px-6 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
    
    <!-- Left Column: Add Task Form -->
    <div class="space-y-6">
      <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
        <h2 class="text-base font-bold text-white mb-1 flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-blue-400"></i>
          <span>Create New Task</span>
        </h2>
        <p class="text-xs text-slate-400 mb-4">Adds a task via POST /api/tasks</p>

        <form id="taskForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Title</label>
            <input 
              type="text" 
              id="taskTitle" 
              required
              placeholder="e.g. Deploy container cluster" 
              class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500"
            >
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Description</label>
            <textarea 
              id="taskDesc" 
              rows="3"
              placeholder="Provide task notes..." 
              class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white placeholder-slate-600 focus:outline-none focus:border-blue-500"
            ></textarea>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Priority</label>
              <select id="taskPriority" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white focus:outline-none focus:border-blue-500">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Status</label>
              <select id="taskStatus" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-800 text-xs text-white focus:outline-none focus:border-blue-500">
                <option value="pending" selected>Pending</option>
                <option value="in_progress">In Progress</option>
                <option value="completed">Completed</option>
              </select>
            </div>
          </div>

          <button 
            type="submit" 
            id="submitBtn"
            class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs transition-all shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2"
          >
            <i class="fa-solid fa-paper-plane"></i>
            <span>Add Task</span>
          </button>
        </form>
      </div>

      <!-- Backend Specs Card -->
      <div class="bg-slate-900/60 p-5 rounded-2xl border border-slate-800 text-xs text-slate-400 space-y-2 font-mono">
        <div class="text-slate-300 font-bold mb-1 font-sans">API Architecture:</div>
        <div>GET  /api/health</div>
        <div>GET  /api/tasks</div>
        <div>POST /api/tasks</div>
        <div>DELETE /api/tasks/{id}</div>
      </div>
    </div>

    <!-- Right Column: Task List -->
    <div class="md:col-span-2 space-y-4">
      <div class="flex items-center justify-between pb-2">
        <div>
          <h2 class="text-lg font-bold text-white">Active Task Board</h2>
          <p class="text-xs text-slate-400">Live persistence from SQLite / Supabase</p>
        </div>
        <button 
          id="refreshBtn"
          class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 flex items-center gap-1.5 transition-all"
        >
          <i class="fa-solid fa-rotate-right" id="refreshIcon"></i>
          <span>Refresh</span>
        </button>
      </div>

      <!-- Task Cards Stream -->
      <div id="taskList" class="space-y-3">
        <div class="p-8 text-center text-slate-500 text-sm">
          Loading tasks from backend...
        </div>
      </div>
    </div>

  </main>

  <script>
    const API_BASE = "http://localhost:8001";

    async function checkHealth() {
      const badge = document.getElementById("healthBadge");
      try {
        const res = await fetch(`${API_BASE}/api/health`);
        if (res.ok) {
          const data = await res.json();
          badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-xs text-emerald-400 font-semibold";
          badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span>Backend Online (200 OK)</span>`;
        } else {
          throw new Error("HTTP " + res.status);
        }
      } catch (err) {
        badge.className = "flex items-center gap-2 px-3 py-1.5 rounded-full bg-rose-500/10 border border-rose-500/30 text-xs text-rose-400 font-semibold";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-rose-500"></span><span>Disrupted (${err.message})</span>`;
      }
    }

    async function loadTasks() {
      const listEl = document.getElementById("taskList");
      const refreshIcon = document.getElementById("refreshIcon");
      refreshIcon.classList.add("fa-spin");

      try {
        const res = await fetch(`${API_BASE}/api/tasks`);
        if (!res.ok) throw new Error("Backend query failed");
        const tasks = await res.json();

        if (tasks.length === 0) {
          listEl.innerHTML = `
            <div class="bg-slate-900/60 p-8 rounded-2xl border border-slate-800 text-center space-y-2">
              <i class="fa-solid fa-list-check text-2xl text-slate-600"></i>
              <div class="text-sm text-slate-400 font-medium">No tasks found</div>
              <p class="text-xs text-slate-500">Create your first task using the left panel.</p>
            </div>
          `;
          return;
        }

        listEl.innerHTML = tasks.map(task => {
          const priorityColor = 
            task.priority === "high" ? "bg-rose-500/20 text-rose-400 border-rose-500/30" :
            task.priority === "medium" ? "bg-amber-500/20 text-amber-400 border-amber-500/30" :
            "bg-blue-500/20 text-blue-400 border-blue-500/30";

          return `
            <div class="p-4 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-700 transition-all flex items-start justify-between gap-4">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase border ${priorityColor}">
                    ${task.priority}
                  </span>
                  <span class="text-xs text-slate-500 font-mono">#${task.id}</span>
                  <span class="text-xs text-slate-400">• ${task.status}</span>
                </div>
                <h3 class="text-sm font-semibold text-white">${escapeHtml(task.title)}</h3>
                ${task.description ? `<p class="text-xs text-slate-400">${escapeHtml(task.description)}</p>` : ''}
              </div>

              <button 
                onclick="deleteTask(${task.id})"
                class="p-2 rounded-lg bg-slate-800/80 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 transition-all"
                title="Delete task"
              >
                <i class="fa-solid fa-trash-can text-xs"></i>
              </button>
            </div>
          `;
        }).join("");

      } catch (err) {
        listEl.innerHTML = `
          <div class="bg-rose-950/20 p-6 rounded-2xl border border-rose-900/40 text-center space-y-2">
            <i class="fa-solid fa-triangle-exclamation text-rose-400 text-xl"></i>
            <div class="text-sm font-bold text-rose-300">Backend Communication Error</div>
            <p class="text-xs text-slate-400">${err.message}</p>
          </div>
        `;
      } finally {
        refreshIcon.classList.remove("fa-spin");
      }
    }

    async function deleteTask(id) {
      if (!confirm(`Delete task #${id}?`)) return;
      try {
        const res = await fetch(`${API_BASE}/api/tasks/${id}`, { method: "DELETE" });
        if (!res.ok) throw new Error("Delete failed");
        loadTasks();
      } catch (err) {
        alert("Error deleting task: " + err.message);
      }
    }

    document.getElementById("taskForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;

      const title = document.getElementById("taskTitle").value;
      const description = document.getElementById("taskDesc").value;
      const priority = document.getElementById("taskPriority").value;
      const status = document.getElementById("taskStatus").value;

      try {
        const res = await fetch(`${API_BASE}/api/tasks`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, description, priority, status })
        });
        if (!res.ok) throw new Error("Failed to create task");
        document.getElementById("taskForm").reset();
        loadTasks();
      } catch (err) {
        alert("Error adding task: " + err.message);
      } finally {
        submitBtn.disabled = false;
      }
    });

    document.getElementById("refreshBtn").addEventListener("click", () => {
      checkHealth();
      loadTasks();
    });

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Initial load
    checkHealth();
    loadTasks();
    setInterval(checkHealth, 10000);
  </script>
</body>
</html>
